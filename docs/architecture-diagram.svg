<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="headerGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="headerGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="headerGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="headerGradient4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片阴影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- 标题 -->
  <text x="600" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    系统架构图
  </text>
  <text x="600" y="80" font-family="'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    System Architecture Diagram
  </text>

  <!-- ==================== 第1层：用户交互层 ==================== -->
  <g transform="translate(100, 110)">
    <!-- 层标题背景 -->
    <rect x="0" y="0" width="1000" height="50" rx="8" fill="url(#headerGradient1)" filter="url(#cardShadow)"/>
    <text x="500" y="32" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      【 1. 用户交互层 】
    </text>

    <!-- 描述文字 -->
    <text x="500" y="75" font-family="'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" fill="#666">
      负责接收自然语言查询，返回结构化合规答案
    </text>

    <!-- 模块卡片 -->
    <g transform="translate(80, 90)">
      <!-- RESTful API -->
      <rect x="0" y="0" width="240" height="80" rx="8" fill="white" stroke="#667eea" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="120" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">RESTful API</text>
      <text x="120" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">标准化接口服务</text>

      <!-- Web 界面 -->
      <rect x="280" y="0" width="240" height="80" rx="8" fill="white" stroke="#667eea" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="400" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Web 界面</text>
      <text x="400" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">浏览器访问入口</text>

      <!-- 移动端应用 -->
      <rect x="560" y="0" width="240" height="80" rx="8" fill="white" stroke="#667eea" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="680" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">移动端应用</text>
      <text x="680" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">iOS / Android 客户端</text>
    </g>

    <!-- 向下箭头 -->
    <line x1="500" y1="200" x2="500" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="200" x2="250" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="750" y1="200" x2="750" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ==================== 第2层：应用服务层 ==================== -->
  <g transform="translate(100, 360)">
    <!-- 层标题背景 -->
    <rect x="0" y="0" width="1000" height="50" rx="8" fill="url(#headerGradient2)" filter="url(#cardShadow)"/>
    <text x="500" y="32" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      【 2. 应用服务层 】
    </text>

    <!-- 描述文字 -->
    <text x="500" y="75" font-family="'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" fill="#666">
      承载各项具体业务功能与系统管理交互
    </text>

    <!-- 模块卡片 -->
    <g transform="translate(80, 90)">
      <!-- 问答接口管理 -->
      <rect x="0" y="0" width="240" height="80" rx="8" fill="white" stroke="#f5576c" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="120" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">问答接口管理</text>
      <text x="120" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Query Management</text>

      <!-- 版本追溯管理 -->
      <rect x="280" y="0" width="240" height="80" rx="8" fill="white" stroke="#f5576c" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="400" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">版本追溯管理</text>
      <text x="400" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Version Tracking</text>

      <!-- 合规性检查 -->
      <rect x="560" y="0" width="240" height="80" rx="8" fill="white" stroke="#f5576c" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="680" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">合规性检查</text>
      <text x="680" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Compliance Check</text>
    </g>

    <!-- 向下箭头 -->
    <line x1="500" y1="200" x2="500" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="200" x2="250" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="750" y1="200" x2="750" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ==================== 第3层：核心引擎层 ==================== -->
  <g transform="translate(100, 610)">
    <!-- 层标题背景 -->
    <rect x="0" y="0" width="1000" height="50" rx="8" fill="url(#headerGradient3)" filter="url(#cardShadow)"/>
    <text x="500" y="32" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      【 3. 核心引擎层 】
    </text>

    <!-- 描述文字 -->
    <text x="500" y="75" font-family="'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" fill="#666">
      系统的核心处理单元，执行多模式检索、过滤与复杂规则推理
    </text>

    <!-- 模块卡片 -->
    <g transform="translate(30, 90)">
      <!-- 元数据过滤模块 -->
      <rect x="0" y="0" width="200" height="80" rx="8" fill="white" stroke="#4facfe" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="100" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">元数据过滤模块</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Metadata Filter</text>

      <!-- 联合检索模块 -->
      <rect x="230" y="0" width="200" height="80" rx="8" fill="white" stroke="#4facfe" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="330" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">联合检索模块</text>
      <text x="330" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Joint Retrieval</text>

      <!-- 知识图谱推理模块 -->
      <rect x="460" y="0" width="200" height="80" rx="8" fill="white" stroke="#4facfe" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="560" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">知识图谱推理模块</text>
      <text x="560" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Knowledge Graph</text>

      <!-- "从旧从轻"判断模块 -->
      <rect x="690" y="0" width="200" height="80" rx="8" fill="white" stroke="#4facfe" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="790" y="35" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">"从旧从轻"判断模块</text>
      <text x="790" y="55" font-family="'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Rule Judgment</text>
    </g>

    <!-- 向下箭头 -->
    <line x1="500" y1="200" x2="500" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="200" x2="250" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="750" y1="200" x2="750" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ==================== 第4层：基础设施层 ==================== -->
  <g transform="translate(100, 860)">
    <!-- 层标题背景 -->
    <rect x="0" y="0" width="1000" height="50" rx="8" fill="url(#headerGradient4)" filter="url(#cardShadow)"/>
    <text x="500" y="32" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      【 4. 基础设施层 】
    </text>

    <!-- 描述文字 -->
    <text x="500" y="75" font-family="'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" fill="#666">
      提供底层数据存储、图谱关联与强大的大模型算力支撑
    </text>

    <!-- 模块卡片 -->
    <g transform="translate(30, 90)">
      <!-- 向量数据库 FAISS -->
      <rect x="0" y="0" width="200" height="80" rx="8" fill="white" stroke="#43e97b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="100" y="30" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">向量数据库</text>
      <text x="100" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#43e97b">FAISS</text>
      <text x="100" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">向量相似度检索</text>

      <!-- 图数据库 Neo4j -->
      <rect x="230" y="0" width="200" height="80" rx="8" fill="white" stroke="#43e97b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="330" y="30" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">图数据库</text>
      <text x="330" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#43e97b">Neo4j</text>
      <text x="330" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">关系图谱存储</text>

      <!-- 关系数据库 PostgreSQL -->
      <rect x="460" y="0" width="200" height="80" rx="8" fill="white" stroke="#43e97b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="560" y="30" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">关系数据库</text>
      <text x="560" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#43e97b">PostgreSQL</text>
      <text x="560" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">结构化数据存储</text>

      <!-- 大语言模型 LLM -->
      <rect x="690" y="0" width="200" height="80" rx="8" fill="white" stroke="#43e97b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="790" y="30" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">大语言模型推理引擎</text>
      <text x="790" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#43e97b">LLM</text>
      <text x="790" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">智能推理与生成</text>
    </g>
  </g>

  <!-- 双向数据流箭头（右侧） -->
  <g transform="translate(1120, 0)">
    <defs>
      <marker id="arrowheadUp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#999"/>
      </marker>
      <marker id="arrowheadDown2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#999"/>
      </marker>
    </defs>

    <!-- 向下箭头 -->
    <line x1="0" y1="360" x2="0" y2="620" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadDown2)"/>
    <!-- 向上箭头 -->
    <line x1="15" y1="870" x2="15" y2="610" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadUp)"/>

    <text x="25" y="620" font-family="'Microsoft YaHei', sans-serif" font-size="12" fill="#999">请求 ↓</text>
    <text x="25" y="870" font-family="'Microsoft YaHei', sans-serif" font-size="12" fill="#999">响应 ↑</text>
  </g>

</svg>