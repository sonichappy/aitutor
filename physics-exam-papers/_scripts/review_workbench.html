<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重庆物理 · 图片验收</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#1e293b;background:#f4f6f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit}button,select{border:1px solid #d9e0e7;border-radius:8px;background:#fff;padding:8px 12px;color:inherit;cursor:pointer}button:hover{border-color:#2563eb}button:disabled{opacity:.4;cursor:default}button.active{background:#eaf1ff;border-color:#2563eb;color:#1d4ed8}header{padding:20px 26px 14px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:21px;margin:0 0 5px}small,.muted{color:#64748b}#saveState{font-size:13px}.error{color:#b91c1c!important}.topbar{padding:14px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.progress{height:5px;width:180px;background:#dfe6ee;border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;padding:0 20px 20px}.list{background:white;border:1px solid #e2e8f0;border-radius:12px;max-height:75vh;overflow:auto;padding:7px}.list button{display:block;text-align:left;width:100%;margin-bottom:4px;border-color:transparent;font-size:13px}.list button.active{border-color:#93b4fa}.tag{display:inline-block;border-radius:5px;padding:2px 6px;background:#f1f5f9;font-size:11px;margin-top:4px}.pass{color:#047857;background:#ecfdf5}.repair{color:#b45309;background:#fffbeb}.uncertain{color:#7c3aed;background:#f5f3ff}.workspace{min-width:0}.titlebar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.titlebar h2{font-size:17px;margin:0}.columns{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(300px,1.25fr) minmax(280px,1.1fr);gap:12px}.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;min-width:0}.panelhead{padding:12px 14px;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-between;gap:5px;font-weight:600}.content{padding:14px;max-height:56vh;overflow:auto}.question{white-space:pre-wrap;font-size:13px;line-height:1.8;overflow-wrap:anywhere}.scopebox{background:#eff6ff;border-left:3px solid #3b82f6;padding:10px;white-space:pre-wrap;font-size:12px;line-height:1.6;margin-bottom:14px}.imagewrap{position:relative;margin:0 auto;line-height:0;cursor:zoom-in}.imagewrap img{width:100%;height:auto;display:block}.box{position:absolute;border:2px dashed #f59e0b;pointer-events:none}.imagearea{padding:12px;overflow:auto;max-height:56vh;background:#f8fafc;min-height:280px}.imagearea .crop{max-width:100%;max-height:50vh;object-fit:contain;cursor:zoom-in;display:block;margin:18px auto}.tabrow{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fafbfc}.hint{font-size:11px;color:#64748b;padding:6px 12px 10px}.reviewbar{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.checkrow{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px}.checkrow label{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:#2563eb;width:16px;height:16px}textarea{width:100%;border:1px solid #d9e0e7;border-radius:8px;padding:10px;min-height:64px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.actions .approve{background:#047857;color:white;border-color:#047857}.actions .fix{color:#a16207}.actions .unsure{color:#7c3aed}.spacer{flex:1}details{font-size:12px;color:#64748b;margin-top:14px;line-height:1.65}summary{cursor:pointer}dialog{border:0;border-radius:12px;width:94vw;height:92vh;padding:14px;background:#fff}dialog::backdrop{background:#0f172acc}.zoomtools{display:flex;gap:12px;align-items:center;margin-bottom:10px}.zoomcanvas{height:calc(100% - 50px);overflow:auto;background:#e8ecf1;padding:20px}.zoomcanvas img{display:block;margin:auto;max-width:none}#notice{color:#b45309;font-size:12px}.empty{padding:40px;color:#64748b}@media(max-width:1200px){.shell{grid-template-columns:170px minmax(0,1fr)}.columns{grid-template-columns:1fr 1fr}.panel:first-child{grid-column:1/-1}.content{max-height:230px}}@media(max-width:750px){header{padding:16px}.shell{display:block;padding:0 10px}.list{max-height:125px;margin-bottom:12px}.columns{display:block}.panel{margin-bottom:12px}.topbar{padding:12px}.progress{width:100px}.imagearea{max-height:420px}.zoomtools{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>重庆物理 · 图片验收</h1><small>2022 年独立 A / B 卷 · 按需确认，随时回到原卷重新裁切</small></div><div><span id="saveState">正在读取验收记录…</span> <a href="/bank?pilot=chongqing2022" style="margin-right:12px">返回题库选题</a><button id="export">导出记录</button></div></header>
<div class="topbar"><strong id="progressText"></strong><div class="progress"><i id="progressBar"></i></div><select id="filter" aria-label="筛选验收状态"><option value="all">全部项目</option><option value="pending">未验收</option><option value="pass">已通过</option><option value="repair">需修复</option><option value="uncertain">无法确认</option><option value="candidate">有新裁剪候选</option></select><span class="muted" id="counts"></span></div>
<div class="shell"><nav class="list" id="list" aria-label="验收图片列表"></nav><main class="workspace" id="workspace"><div class="titlebar"><h2 id="itemTitle"></h2><span id="position" class="muted"></span></div><div class="columns">
<section class="panel"><div class="panelhead">题目与本图要求</div><div class="content"><div class="scopebox" id="scope"></div><div class="question" id="question"></div><details><summary>模型意见（仅供参考）</summary><div id="modelReason"></div></details></div></section>
<section class="panel"><div class="panelhead">原卷页面 <button id="sourceZoom">放大原卷</button></div><div id="sourceTabs" class="tabrow"></div><div class="imagearea"><div id="sourceWrap" class="imagewrap"><img id="source" alt="原卷页面"></div></div><div class="hint">点击图片放大。橙色虚线为模型候选定位，仅供参照。</div></section>
<section class="panel"><div class="panelhead"><span id="cropTitle">待验收图片</span> <button id="cropZoom">放大图片</button></div><div class="tabrow"><button id="originalTab">当前图片</button><button id="candidateTab">修复候选</button></div><div class="hint" id="duplicateHint" role="status" style="color:#92400e;background:#fffbeb;display:none"></div><div class="imagearea"><img class="crop" id="crop" alt="待验收图片"></div><div class="hint" id="targetHint"></div></section></div>
<section class="reviewbar"><div class="checkrow"><label><input id="match" type="checkbox">对应正确</label><label><input id="complete" type="checkbox">内容完整</label><label><input id="scopeCheck" type="checkbox">范围合适</label><label><input id="readable" type="checkbox">清晰可作答</label></div><textarea id="note" aria-label="验收备注" placeholder="记录缺少的元件、被截断的标记或其他问题（自动保存）"></textarea><div class="actions"><button class="approve" id="pass">通过 · 1</button><button class="fix" id="repair">需修复 · 2</button><button class="unsure" id="uncertain">无法确认 · 3</button><button id="reset">撤销判定</button><button id="manual">从原卷框选裁图</button><button id="applyFigure">确认所选图片并更新题库</button><button id="undoFigure">恢复上一版配图</button><span class="spacer"></span><button id="previous">← 上一张</button><button id="next">下一张 →</button></div><p id="notice">“需修复”只保存问题记录；“通过”或保存裁图会更新当前图槽并保留可恢复的历史版本。</p></section></main></div>
<dialog id="zoom"><div class="zoomtools"><strong id="zoomTitle"></strong><input id="zoomScale" type="range" min="40" max="250" value="100" aria-label="缩放比例"><span id="zoomPercent">100%</span><button id="zoomClose">关闭 · Esc</button></div><div class="zoomcanvas"><img id="zoomImage" alt="放大图片"></div></dialog>
<dialog id="cropDialog"><div class="zoomtools"><strong>从原卷框选 · 仅修改当前图槽</strong><select id="cropPage" aria-label="裁切原卷页"></select><button id="cancelCrop">关闭</button></div><p id="cropInstructions" style="padding:6px;color:#92400e">原页位置仅供参考。可选择本卷全部页面；拖动框选后检查下方预览。</p><div style="height:48vh;overflow:auto;background:#e8ecf1"><div id="cropStage" style="position:relative;touch-action:none;user-select:none;max-width:950px;margin:auto;cursor:crosshair"><img id="cropSource" alt="可框选的原卷" draggable="false" style="display:block;width:100%;pointer-events:none"><div id="selection" style="display:none;position:absolute;border:2px solid #2563eb;background:#2563eb22;pointer-events:none"></div></div></div><div style="display:flex;gap:18px;padding-top:10px;align-items:start;flex-wrap:wrap"><canvas id="cropPreview" style="max-width:45%;max-height:19vh;border:1px solid #ddd"></canvas><div><p id="cropRect">尚未框选</p><div class="checkrow"><label><input type="checkbox" id="cmatch">对应正确</label><label><input type="checkbox" id="ccomplete">内容完整</label><label><input type="checkbox" id="cscope">范围合适</label><label><input type="checkbox" id="creadable">清晰可作答</label></div><button id="saveCrop">保存裁图并确认到题库</button><p id="cropError" class="error"></p></div></div></dialog>
<script>
const DATA=__WORKBENCH_DATA__;
const $=id=>document.getElementById(id), LABELS={pending:'未验收',pass:'已通过',repair:'需修复',uncertain:'无法确认'};
let records={},index=0,sourceIndex=0,target='original',timer=null,chain=Promise.resolve(),loadOK=false;
function item(){return DATA.items[index]}
function record(i=item()){const saved=records[i.id];if(saved&&saved.fingerprint===i.fingerprint&&['repair','uncertain'].includes(saved.decision))return saved;if(i.humanStatus?.status==='confirmed')return {decision:'pass',target:'original',note:'已人工确认到题库',checks:{match:true,complete:true,scope:true,readable:true},fingerprint:i.fingerprint};const r=records[i.id];return r&&r.fingerprint===i.fingerprint?r:{decision:'pending',target:i.candidate?'candidate':'original',note:'',checks:{match:false,complete:false,scope:false,readable:false},fingerprint:i.fingerprint}}
function filtered(){return DATA.items.map((i,n)=>({i,n})).filter(({i})=>{const f=$('filter').value;return f==='all'||(f==='candidate'?!!i.candidate:record(i).decision===f)})}
function badge(text,cls){const e=document.createElement('span');e.className='tag '+cls;e.textContent=text;return e}
function refreshList(){const totals={pass:0,repair:0,uncertain:0,pending:0};DATA.items.forEach(i=>totals[record(i).decision]++);const done=DATA.items.length-totals.pending;$('progressText').textContent=`已验收 ${done} / ${DATA.items.length}`;$('progressBar').style.width=(100*done/Math.max(1,DATA.items.length))+'%';$('counts').textContent=`通过 ${totals.pass} · 需修复 ${totals.repair} · 无法确认 ${totals.uncertain}`;$('list').replaceChildren();const visible=filtered();if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='此筛选下没有项目';$('list').append(e)}visible.forEach(({i,n})=>{const b=document.createElement('button');b.className=n===index?'active':'';const t=document.createElement('div');t.textContent=`${i.paper.endsWith('A 卷')?'A':'B'} 卷 · 第 ${i.number} 题 / 图槽 ${i.figKey}`;b.append(t,badge(LABELS[record(i).decision],record(i).decision));if(i.candidate)b.append(badge('新候选',''));b.onclick=()=>navigate(n);$('list').append(b)});$('position').textContent=`${index+1} / ${DATA.items.length}`;const pos=visible.findIndex(v=>v.n===index);$('previous').disabled=pos<=0;$('next').disabled=pos<0||pos===visible.length-1}
function questionText(q,depth=0){let t=q.stem||'';let opts=q.options||[];if(typeof opts==='string'){try{opts=JSON.parse(opts)}catch{opts=[]}}for(const o of opts)t+='\n'+(o.label||'')+'. '+(o.text||'');let subs=q.subQuestions||[];if(typeof subs==='string'){try{subs=JSON.parse(subs)}catch{subs=[]}}for(const s of subs)t+='\n\n'+(s.number||'')+' '+questionText(s,depth+1);return t.replace(/\{\{fig:(\d+)\}\}/g,'【图槽 $1】').replace(/\{\{blank:(\d+)\}\}/g,'______')}
function sourceView(){const i=item();$('sourceTabs').replaceChildren();i.sources.forEach((p,n)=>{const b=document.createElement('button');b.textContent='原页 '+p.name;b.className=n===sourceIndex?'active':'';b.onclick=()=>{sourceIndex=n;sourceView()};$('sourceTabs').append(b)});$('source').src=DATA.images[i.sources[sourceIndex]?.asset]||'';$('sourceWrap').querySelectorAll('.box').forEach(e=>e.remove());for(const b of i.boxes){const v=b.box;if(b.sourcePage!==sourceIndex+1||!Array.isArray(v)||v.length!==4||v.some(x=>!Number.isFinite(x)||x<0||x>1)||v[2]<=v[0]||v[3]<=v[1])continue;const el=document.createElement('div');el.className='box';Object.assign(el.style,{left:v[0]*100+'%',top:v[1]*100+'%',width:(v[2]-v[0])*100+'%',height:(v[3]-v[1])*100+'%'});$('sourceWrap').append(el)}}
function cropView(){const i=item();const label=`${i.paper} · 第 ${i.number} 题 · 图槽 ${i.figKey}`;$('cropTitle').textContent=`第 ${i.number} 题 · 图槽 ${i.figKey}`;$('crop').alt=label+' · '+(target==='candidate'?'修复候选':'当前图片');const duplicates=DATA.items.filter(v=>v.id!==i.id&&v[target]&&v[target]===i[target]);$('duplicateHint').style.display=duplicates.length?'block':'none';$('duplicateHint').textContent=duplicates.length?'原始数据重复：此图片与 '+duplicates.map(v=>`${v.paper.endsWith('A 卷')?'A':'B'} 卷第 ${v.number} 题 / 图槽 ${v.figKey}`).join('、')+' 完全相同。已切换项目；重复配图需结合原卷复核。':'';$('crop').src=DATA.images[i[target]]||'';$('originalTab').className=target==='original'?'active':'';$('candidateTab').className=target==='candidate'?'active':'';$('candidateTab').disabled=!i.candidate;$('targetHint').textContent=i.isFallback&&target==='original'?'尚无可靠裁图：当前暂示原卷整页，请从原卷框选。推荐页码未人工确认，可选择其他原页。':target==='candidate'?'本次判定针对：修复候选。可切换查看当前图片。':'本次判定针对：当前图片。'+(i.candidate?'可切换查看修复候选。':'此项目没有新裁剪候选。')}
function render(){const i=item();if(!i){$('workspace').textContent='没有待验收项目';return}const r=record(i);target=r.target;sourceIndex=0;$('undoFigure').disabled=!i.humanStatus;$('itemTitle').textContent=`${i.paper} · 第 ${i.number} 题 · 图槽 ${i.figKey}`;$('scope').textContent=i.scope;$('question').textContent=questionText(i.question);$('modelReason').textContent=i.review.reason||'暂无模型意见';$('note').value=r.note||'';for(const [id,key] of [['match','match'],['complete','complete'],['scopeCheck','scope'],['readable','readable']])$(id).checked=r.checks?.[key]||false;sourceView();cropView();refreshList()}
function capture(decision=record().decision){return {id:item().id,fingerprint:item().fingerprint,decision,target,note:$('note').value,checks:{match:$('match').checked,complete:$('complete').checked,scope:$('scopeCheck').checked,readable:$('readable').checked}}}
async function save(value){if(!loadOK)throw Error('验收记录尚未读取，请刷新');$('saveState').textContent='保存中…';$('saveState').className='';try{const response=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});const data=await response.json();if(!response.ok)throw Error(data.error||'保存失败');records[value.id]=data;$('saveState').textContent='已保存到本地 · '+new Date(data.updatedAt).toLocaleTimeString('zh-CN');refreshList();return data}catch(e){$('saveState').textContent='未保存：'+e.message;$('saveState').className='error';throw e}}
function enqueue(value){chain=chain.catch(()=>{}).then(()=>save(value));return chain}
function delayed(){clearTimeout(timer);timer=setTimeout(()=>{timer=null;enqueue(capture()).catch(()=>{})},500)}
async function flush(){if(timer){clearTimeout(timer);timer=null;await enqueue(capture())}else await chain}
async function navigate(n){try{await flush();index=n;render();$('notice').textContent='已切换至 '+$('itemTitle').textContent+'。同一原卷页或重复配图可能保持相同外观。'}catch(e){$('notice').textContent='切换失败：'+e.message;$('notice').className='error'}}
async function decide(d){if(d==='pass'&&!['match','complete','scopeCheck','readable'].every(id=>$(id).checked)){$('notice').textContent='请先逐项确认四项检查，再标记通过。';$('notice').className='error';return}if(d==='pass'){try{await updateFigure('/api/apply',{target,checks:capture().checks})}catch(e){$('notice').textContent=e.message}return}clearTimeout(timer);timer=null;$('notice').textContent='验收记录独立保存，不会自动覆盖正式题库图片。';$('notice').className='';try{await enqueue(capture(d))}catch{}}
for(const id of ['match','complete','scopeCheck','readable'])$(id).onchange=()=>{const r=record();if(r.decision==='pass'&&!['match','complete','scopeCheck','readable'].every(k=>$(k).checked)){clearTimeout(timer);timer=null;enqueue(capture('pending')).catch(()=>{})}else delayed()};$('note').oninput=delayed;
for(const d of ['pass','repair','uncertain'])$(d).onclick=()=>decide(d);$('reset').onclick=()=>decide('pending');
for(const t of ['original','candidate'])$(t+'Tab').onclick=async()=>{try{await flush();if(target===t)return;target=t;for(const id of ['match','complete','scopeCheck','readable'])$(id).checked=false;cropView();await enqueue(capture('pending'))}catch{}};
function step(offset){const list=filtered(),p=list.findIndex(v=>v.n===index),next=list[p+offset];if(next)navigate(next.n)}$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('filter').onchange=async()=>{try{await flush();const f=filtered();if(f.length&&!f.some(v=>v.n===index)){index=f[0].n;render()}else refreshList()}catch{}};
function zoom(src,title){$('zoomImage').src=src;$('zoomTitle').textContent=title;$('zoomScale').value=100;scale();$('zoom').showModal()}function scale(){const v=Number($('zoomScale').value);$('zoomPercent').textContent=v+'%';$('zoomImage').style.width=v+'%'}$('zoomScale').oninput=scale;$('zoomClose').onclick=()=>$('zoom').close();$('sourceZoom').onclick=$('sourceWrap').onclick=()=>zoom($('source').src,'原卷 · '+item().sources[sourceIndex].name);$('cropZoom').onclick=$('crop').onclick=()=>zoom($('crop').src,target==='candidate'?'修复候选':'当前图片');
$('export').onclick=async()=>{try{await flush()}catch{}const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='重庆图片验收记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

let cropBox=null,dragStart=null;
function resetCrop(){cropBox=null;dragStart=null;$('selection').style.display='none';$('cropPreview').width=0;$('cropRect').textContent='尚未框选';$('cropError').textContent='';for(const k of ['match','complete','scope','readable'])$('c'+k).checked=false}
function loadCropPage(){resetCrop();$('cropSource').src=DATA.images[item().allSources[Number($('cropPage').value)].asset]}
$('manual').onclick=async()=>{try{await flush();$('cropPage').replaceChildren();item().allSources.forEach((p,n)=>{const o=document.createElement('option');o.value=n;o.textContent='原卷第 '+p.page+' 页（可手动更换）';$('cropPage').append(o)});const suggested=item().allSources.findIndex(p=>p.asset===item().sources[sourceIndex]?.asset);$('cropPage').value=Math.max(0,suggested);loadCropPage();$('cropInstructions').textContent=$('itemTitle').textContent+'。拖动框选，检查预览后保存；原始整页永久保留。';$('cropDialog').showModal()}catch(e){$('notice').textContent=e.message}};
$('cropPage').onchange=loadCropPage;$('cancelCrop').onclick=()=>$('cropDialog').close();
function point(e){const r=$('cropSource').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
$('cropStage').onpointerdown=e=>{if(e.button!==0||!$('cropSource').naturalWidth)return;e.preventDefault();resetCrop();dragStart=point(e);$('cropStage').setPointerCapture(e.pointerId)};
$('cropStage').onpointermove=e=>{if(!dragStart)return;const p=point(e);cropBox=[Math.min(p[0],dragStart[0]),Math.min(p[1],dragStart[1]),Math.max(p[0],dragStart[0]),Math.max(p[1],dragStart[1])];Object.assign($('selection').style,{display:'block',left:cropBox[0]*100+'%',top:cropBox[1]*100+'%',width:(cropBox[2]-cropBox[0])*100+'%',height:(cropBox[3]-cropBox[1])*100+'%'})};
$('cropStage').onpointerup=e=>{if(!dragStart)return;$('cropStage').onpointermove(e);dragStart=null;const im=$('cropSource'),b=cropBox,w=im.naturalWidth,h=im.naturalHeight;const x=Math.floor(b[0]*w),y=Math.floor(b[1]*h),cw=Math.ceil(b[2]*w)-x,ch=Math.ceil(b[3]*h)-y;if(cw<8||ch<8){resetCrop();return}const canvas=$('cropPreview');canvas.width=cw;canvas.height=ch;canvas.getContext('2d').drawImage(im,x,y,cw,ch,0,0,cw,ch);$('cropRect').textContent=`预览：${cw} × ${ch} 像素；请确认完整、清晰且无其他题目。`};
$('cropStage').onpointercancel=()=>{resetCrop()};
async function updateFigure(path,extra){await flush();const i=item();const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:i.id,expectedPath:i.expectedPath,expectedHash:i.expectedHash,expectedVersion:i.humanStatus?.version||null,note:$('note').value,...extra})});const data=await response.json();if(!response.ok)throw Error(data.error||'保存失败');timer=null;history.replaceState(null,'','/?id='+encodeURIComponent(i.id));location.reload()}
$('saveCrop').onclick=async()=>{if(!cropBox){$('cropError').textContent='请先拖动框选';return}const button=$('saveCrop');button.disabled=true;try{await updateFigure('/api/apply',{target:'manual',source:item().allSources[Number($('cropPage').value)].path,box:cropBox,checks:Object.fromEntries(['match','complete','scope','readable'].map(k=>[k,$('c'+k).checked]))})}catch(e){$('cropError').textContent=e.message;button.disabled=false}};
$('applyFigure').onclick=async()=>{const button=$('applyFigure');button.disabled=true;try{await updateFigure('/api/apply',{target,checks:capture().checks})}catch(e){$('notice').textContent=e.message;button.disabled=false}};
$('undoFigure').onclick=async()=>{try{await updateFigure('/api/undo',{version:item().humanStatus?.version})}catch(e){$('notice').textContent=e.message}};
document.addEventListener('keydown',e=>{if($('cropDialog').open||$('zoom').open||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(['1','2','3'].includes(e.key))decide(['pass','repair','uncertain'][Number(e.key)-1])});
window.addEventListener('beforeunload',e=>{if(timer||$('saveState').textContent.startsWith('保存中')||$('saveState').classList.contains('error')){e.preventDefault();e.returnValue=''}});
const requestedId=new URLSearchParams(location.search).get('id');if(requestedId){const requestedIndex=DATA.items.findIndex(i=>i.id===requestedId);if(requestedIndex>=0)index=requestedIndex;}
fetch('/api/records').then(r=>{if(!r.ok)throw Error('读取失败');return r.json()}).then(r=>{records=r;loadOK=true;$('saveState').textContent='本地记录已读取';render()}).catch(e=>{$('saveState').textContent='读取失败，请刷新：'+e.message;$('saveState').className='error'});
</script></body></html>
