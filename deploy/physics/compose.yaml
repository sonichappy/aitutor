services:
  app:
    build:
      context: ../..
      dockerfile: deploy/physics/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${PHYSICS_DATA_DIR:?Set PHYSICS_DATA_DIR}:/data/physics
    networks: [private]
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on:
      app:
        condition: service_healthy
networks:
  private:
volumes:
  caddy_data:
  caddy_config:
